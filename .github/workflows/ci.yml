name: CI — Contract Tests & Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  contract-tests:
    name: node --check + Test.js contract tests + secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax check (node --check ทุกไฟล์ app/*.js)
        shell: bash
        run: |
          set -e
          while IFS= read -r -d '' f; do
            node --check "$f"
            echo "OK  $f"
          done < <(find app -name '*.js' -type f -print0)
          echo "--- SYNTAX OK (ทุกไฟล์) ---"

      - name: Contract tests (Test.js ใน sandbox จำลอง Apps Script runtime)
        run: node scripts/ci-test.js

      - name: Architecture tests (engine wiring / plug-in seams)
        run: |
          node tests/architecture/system-factory.test.js
          node tests/architecture/member-repository-factory-retirement.test.js
          node tests/architecture/repository-policy-helper-retirement.test.js
          node tests/architecture/repository-activation-policy-retirement.test.js
          node tests/architecture/repository-renewal-policy-retirement.test.js
          node tests/architecture/audit-timestamp-authority.test.js
          node tests/architecture/member-audit-store-extraction.test.js
          node tests/architecture/audit-caller-authority.test.js
          node tests/architecture/audit-id-authority.test.js
          node tests/architecture/core-time-determinism.test.js
          node tests/architecture/protected-identity-usecase-authority.test.js
          node tests/architecture/delivery-config-clock-wiring.test.js
          node tests/architecture/richmenu-config-wiring.test.js
          node tests/architecture/config-port-authority.test.js
          node tests/architecture/clock-port-authority.test.js
          node tests/architecture/runtime-global-layer-boundary.test.js
          node tests/architecture/loan-calculator-authority.test.js

      - name: Port contract tests (plug-compatible adapters)
        run: |
          node tests/contracts/member-repository.contract.test.js
          node tests/contracts/inmemory-member-repository.test.js
          node tests/contracts/audit-config-ports.test.js
          node tests/contracts/id-port.test.js
          node tests/contracts/scheduled-ports.test.js
          node tests/contracts/web-session-ports.test.js
          node tests/contracts/web-session-production-adapters.test.js
          node tests/contracts/audit-query-port.test.js
          node tests/contracts/report-query-port.test.js

      - name: Engine tests (headless deterministic business engines)
        run: |
          node tests/engine/member-access-engine.test.js
          node tests/engine/identity-authorization.test.js
          node tests/engine/line-identity.test.js
          node tests/engine/member-activation-engine.test.js
          node tests/engine/loan-calculation-engine.test.js
          node tests/engine/web-session-engine.test.js

      - name: Application use-case tests (headless orchestration)
        run: |
          node tests/application/current-member-profile.test.js
          node tests/application/current-member-finance.test.js
          node tests/application/activate-member.test.js
          node tests/application/secure-self-activation.test.js
          node tests/application/renew-member.test.js
          node tests/application/scheduled-use-cases.test.js
          node tests/application/calculate-loan.test.js
          node tests/application/web-session.test.js
          node tests/application/web-session-line-exchange.test.js
          node tests/application/web-member-rbac.test.js
          node tests/application/web-admin-settings.test.js
          node tests/application/web-staff-accounts.test.js
          node tests/application/web-role-catalog.test.js
          node tests/application/web-role-assignment.test.js
          node tests/application/web-audit-query.test.js
          node tests/application/web-summary-report.test.js
          node tests/application/web-member-renew-write.test.js

      - name: Scheduled runtime delegation tests
        run: node tests/application/scheduled-runtime-delegation.test.js

      - name: Scheduled compatibility retirement test
        run: node tests/application/scheduled-compatibility-retirement.test.js

      - name: Webhook privacy hardening test
        run: node tests/application/webhook-log-privacy.test.js

      - name: Activation chat handoff security test
        run: node tests/application/chat-activation-handoff.test.js

      - name: Renewal chat handoff security test
        run: node tests/application/chat-renewal-handoff.test.js

      - name: Legacy activation retirement security test
        run: node tests/application/legacy-activation-retirement.test.js

      - name: Legacy renewal retirement security test
        run: node tests/application/legacy-renewal-retirement.test.js

      - name: Web API-key retirement security test
        run: node tests/application/web-api-key-retirement.test.js

      - name: Protected delivery contract tests
        run: |
          node tests/application/protected-profile-api.test.js
          node tests/application/protected-finance-api.test.js
          node tests/application/protected-renew-api.test.js
          node tests/application/secure-self-activation-api.test.js
          node tests/application/loan-calculation-api.test.js
          node tests/application/web-session-api.test.js
          node tests/application/web-member-api.test.js
          node tests/application/web-admin-settings-api.test.js
          node tests/application/web-staff-accounts-api.test.js
          node tests/application/web-role-catalog-api.test.js
          node tests/application/web-role-assignment-api.test.js
          node tests/application/legacy-member-route-retirement.test.js
          node tests/application/web-audit-api.test.js
          node tests/application/web-summary-report-api.test.js
          node tests/application/web-member-renew-write-api.test.js

      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-test-log
          path: |
            **/*.log
          if-no-files-found: ignore

  gitleaks:
    name: gitleaks secret scan (API keys / private keys / generic secrets)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # ตรวจประวัติ git ทั้งหมด (จับ secret ที่หลุดใน commit เก่า)

      - name: Install gitleaks (pinned)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz
          ./gitleaks version

      - name: Secret scan (working tree + git history)
        run: ./gitleaks detect --source . --config .gitleaks.toml --no-banner --exit-code 1 --report-format json --report-path gitleaks-report.json

      - name: Upload gitleaks report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: ignore
