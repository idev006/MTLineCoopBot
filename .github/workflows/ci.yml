name: CI — Contract Tests & Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  contract-tests:
    name: node --check + Test.js contract tests + secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax check (node --check ทุกไฟล์ app/*.js)
        shell: bash
        run: |
          set -e
          while IFS= read -r -d '' f; do
            node --check "$f"
            echo "OK  $f"
          done < <(find app -name '*.js' -type f -print0)
          echo "--- SYNTAX OK (ทุกไฟล์) ---"

      - name: Contract tests (Test.js ใน sandbox จำลอง Apps Script runtime)
        run: node scripts/ci-test.js

      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-test-log
          path: |
            **/*.log
          if-no-files-found: ignore

  gitleaks:
    name: gitleaks secret scan (API keys / private keys / generic secrets)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # ตรวจประวัติ git ทั้งหมด (จับ secret ที่หลุดใน commit เก่า)

      - name: Install gitleaks (pinned)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz
          ./gitleaks version

      - name: Secret scan (working tree + git history)
        run: ./gitleaks detect --source . --config .gitleaks.toml --no-banner --exit-code 1 --report-format json --report-path gitleaks-report.json

      - name: Upload gitleaks report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: ignore
