# .gitleaks.toml — การตั้งค่า secret scan ของ gitleaks (ใช้ใน CI, บทที่ 8.1.3)
# อ้างอิง: https://github.com/gitleaks/gitleaks

title = "MTLineCoopBot — gitleaks config (extends default rules)"

[extend]
# ใช้ default rules ทั้งหมดของ gitleaks + เพิ่ม rule ด้านล่าง

# ── หมายเหตุ (2026-08-12) ──
# เคยมี CHANNEL_ACCESS_TOKEN รั่วใน initial commit → ลบออกจากโค้ดแล้ว +
# หมุน token (การ์ด MT-26) + purge ประวัติ git ด้วย filter-repo (token
# ถูกแทนด้วย ***REMOVED*** ในทุก commit) — ตอนนี้ไม่มี allowlist แล้ว
# gitleaks ตรวจประวัติทั้งหมดแบบเต็มรูปแบบ

# ── Rule เพิ่มเติม: LINE Messaging API Channel Access Token ──
# จับ pattern เฉพาะของ LINE ที่ default rules อาจไม่ครอบคลุม
[[rules]]
id = "line-channel-access-token"
description = "LINE Messaging API Channel Access Token"
regex = '''(?i)(?:line[\s_-]*channel[\s_-]*access[\s_-]*token|CHANNEL_ACCESS_TOKEN)\s*[:=]\s*['"]?([A-Za-z0-9+/]{40,}={0,2})'''
secret-group = 1
